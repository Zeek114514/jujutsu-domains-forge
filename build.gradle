plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
}
version = '1.10.4'
group = 'dev.unlimitedvoid'
base { archivesName = 'unlimited-void-1.20.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            args '--width', '1280', '--height', '720', '--mixin', 'unlimitedvoid.mixins.json'
            property 'forge.logging.console.level', 'info'
            property 'mixin.config', 'unlimitedvoid.mixins.json'
            mods { unlimitedvoid { source sourceSets.main } }
        }
    }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.named('jar', Jar).configure {
    manifest { attributes 'MixinConfigs': 'unlimitedvoid.mixins.json' }
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE-MIT.txt' } }
    from('THIRD_PARTY_NOTICES.md') { into 'META-INF' }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Geometry checks run headlessly; they do not create a client or game world.
sourceSets {
    validation {
        java.srcDir 'tools/validation'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('validateGround', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.server.ShrineGroundCheck15'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.register('validateFuga', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.FugaTimelineCheck'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'validateGround', 'validateFuga' }
tasks.register('validateFugaCombat', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.FugaCombatCheck'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'validateFugaCombat' }

tasks.register('validatePurpleDetonation', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.PurpleDetonationCheck'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'validatePurpleDetonation' }

// Explicit isolated-client instrumentation. Never included in the normal distributable.
if (providers.gradleProperty('visualTest').getOrElse('false') == 'true') {
    sourceSets.main.java.srcDir 'tools/visualTest'
    tasks.named('jar', Jar) { archiveClassifier = 'visual-test' }
}

tasks.register('validateNpcCombat', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.NpcCombatCheck'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'validateNpcCombat' }

tasks.register('validateMahoraga', JavaExec) {
    dependsOn 'classes', 'validationClasses'
    classpath = sourceSets.validation.runtimeClasspath
    mainClass = 'dev.unlimitedvoid.MahoragaRulesCheck'
    jvmArgs '-Djava.awt.headless=true'
}
tasks.named('check') { dependsOn 'validateMahoraga' }
